# Supabase CLI configuration, local development only. Nothing here describes a
# hosted project; linking one is done with `supabase link` and its state stays
# out of the repository.

project_id = "vsv-management-software"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Set to what the migrations are actually verified against, which is Postgres 16.
# Session 1 pinned 15 and verified on 16, so the pin was a claim rather than a
# fact. Change this to match the hosted project the moment one exists: a
# migration that applies on one major version and not the other is a discovery
# best made here rather than on deploy.
major_version = 16

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local mail catcher. Nothing is sent anywhere from a dev machine.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Two roles, both created by an admin. There is no public signup for a winery
# app and an open one would let anyone insert events.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false
