# The sandbox. A second, identical stack with nothing real in it.
#
# Generated from ../../supabase/config.toml with a different project id and
# every port moved up by one hundred, so the two stacks never contend and the
# numbers read as a pair: 54321 is the cellar, 54421 is the sandbox.
#
# **Resetting this one is allowed and resetting the other one is not.** That is
# the whole point of it existing: somewhere to try a thing, record nonsense, and
# throw it away, without the app's real records being anywhere near it.
#
# Regenerate rather than hand-edit if the cellar's config changes, so a setting
# that matters cannot be true in one stack and not the other.

# Supabase CLI configuration, local development only. Nothing here describes a
# hosted project; linking one is done with `supabase link` and its state stays
# out of the repository.

project_id = "vsv-sandbox"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
# Set to what the migrations are actually verified against, which is Postgres 17.
# Session 1 pinned 15 and verified on 16, so the pin was a claim rather than a
# fact; the wire session ran all twenty migrations clean from empty on 17.6
# repeatedly, so this is now a fact rather than a claim. Change it to match the
# hosted project the moment one exists: a migration that applies on one major
# version and not the other is a discovery best made here rather than on deploy.
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54423

# Local mail catcher. Nothing is sent anywhere from a dev machine.
[inbucket]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# A local development value. This names one particular desktop on one particular
# tailnet, which is how the app was reached from a phone during the wire session.
# A fresh clone should change it to http://localhost:5173 or to whatever host it
# is actually served from: GoTrue rejects a redirect to anything not named here,
# so leaving somebody else's hostname in it breaks sign in silently.
site_url = "https://vsv-desktop.tail7e3cc4.ts.net"
additional_redirect_urls = ["http://localhost:5173", "https://vsv-desktop.tail7e3cc4.ts.net"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Open, because the first account has to be creatable and there is nobody to
# create it for you. Closing signup is a decision for the hosted project once
# the admin account exists; doing it here makes a fresh install impossible to
# start, which is exactly the hole the first-run walk exists to find.
enable_signup = true

[auth.email]
enable_signup = true
# Local development has no mailbox worth checking. The hosted project decides
# this for itself.
enable_confirmations = false

[analytics]
enabled = false
